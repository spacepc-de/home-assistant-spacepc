name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
      - name: Install tools
        run: >-
          python -m pip install
          homeassistant==2026.7.4
          pytest-homeassistant-custom-component==0.13.348
          mypy
          ruff
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy
      - name: Test
        run: pytest
      - name: Validate JSON
        run: python -m json.tool custom_components/spacepc/manifest.json >/dev/null
