[project]
name = "home-assistant-spacepc"
version = "0.1.1"
description = "Local Home Assistant integration for SpacePC devices"
requires-python = ">=3.14.2"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["ASYNC", "B", "E", "F", "I", "PERF", "RET", "RUF", "SIM", "UP"]
ignore = [
  "RUF012"
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["custom_components/spacepc"]
